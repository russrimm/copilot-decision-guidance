# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - copilot-decision-guidance

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout
      id-token: write # This is required for requesting the JWT

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build:packages
          npm run build:api
          npm run build:web
          npm run test --if-present

      - name: Prepare deployment package
        run: |
          # Create a clean deployment directory
          mkdir -p deploy
          cp -r apps deploy/
          cp -r packages deploy/
          cp package.json package-lock.json server-production.mjs deploy/
          # Copy startup script
          cp startup.sh deploy/ || true

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C78D00F0CDE44C719C0B5415ABD3CCDE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D117FCB904DA4827985DB9DD939007AD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_73274B4950BA4601A7D6691638830856 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'copilot-decision-guidance'
          slot-name: 'Production'
          package: deploy
          startup-command: 'npm ci --omit=dev && node server-production.mjs'
