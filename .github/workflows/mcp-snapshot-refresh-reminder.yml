name: MCP Snapshot Refresh Reminder

# This workflow enforces the weekly MCP refresh cadence by opening an issue
# when docs/microsoft-learn-weekly-snapshot.json is stale.
#
# Note: GitHub Actions cannot directly invoke Copilot Chat MCP tools.
# Refresh must be performed using Microsoft Learn MCP tools and committed.

on:
  schedule:
    # Every Sunday at 09:00 UTC (ahead of Monday validation)
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind-refresh:
    name: Check MCP Snapshot Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Evaluate snapshot freshness
        id: freshness
        run: |
          node -e "const fs=require('fs'); const p='docs/microsoft-learn-weekly-snapshot.json'; if(!fs.existsSync(p)){console.log('needs_refresh=true'); console.log('age_days=999'); process.exit(0);} const s=JSON.parse(fs.readFileSync(p,'utf8')); const t=Date.parse(s.capturedAt||''); if(Number.isNaN(t)){console.log('needs_refresh=true'); console.log('age_days=999'); process.exit(0);} const age=Math.floor((Date.now()-t)/(1000*60*60*24)); console.log('needs_refresh='+(age>6)); console.log('age_days='+age);" > freshness.txt
          cat freshness.txt
          echo "needs_refresh=$(grep needs_refresh freshness.txt | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "age_days=$(grep age_days freshness.txt | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Create reminder issue when stale
        if: steps.freshness.outputs.needs_refresh == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const age = '${{ steps.freshness.outputs.age_days }}';
            const title = `🔁 Refresh Microsoft Learn MCP Snapshot (${new Date().toISOString().split('T')[0]})`;
            const body = [
              'The weekly MCP snapshot appears stale and should be refreshed before Monday validation.',
              '',
              `- Snapshot age: **${age} day(s)**`,
              '- File: `docs/microsoft-learn-weekly-snapshot.json`',
              '',
              '## Required MCP Workflow',
              '1. Run `microsoft_docs_search` for relevant Microsoft Learn updates.',
              '2. Run `microsoft_docs_fetch` for high-value pages.',
              '3. Update `docs/microsoft-learn-weekly-snapshot.json` (capturedAt, pages, impacts).',
              '4. Implement pending impact updates in portal files.',
              '5. Mark completed impacts as `status: "completed"`.',
              '6. Run `npm run validate` and ensure the report is clean.',
              '',
              'This issue is auto-generated by `.github/workflows/mcp-snapshot-refresh-reminder.yml`.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['documentation', 'automated', 'weekly-validation', 'mcp-refresh-required']
            });
