name: Validate Microsoft Product Updates

# This workflow checks official Microsoft release notes and documentation to ensure
# the repository, survey questions, and documentation remain accurate and up-to-date.
#
# Sources checked:
# - https://learn.microsoft.com/en-us/copilot/microsoft-365/release-notes
# - https://learn.microsoft.com/en-us/microsoft-copilot-studio/whats-new
# - https://learn.microsoft.com/en-us/azure/ai-studio/ (Azure AI Foundry)
# - Microsoft 365 Roadmap, Power Platform Release Planner, and Pricing pages

on:
  # Run weekly on Monday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_notification:
        description: 'Send notification even if no changes detected'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  validate-updates:
    name: Check Microsoft Sources for Updates
    runs-on: ubuntu-latest

    outputs:
      has-changes: ${{ steps.validation.outputs.has-changes }}
      report-path: ${{ steps.validation.outputs.report-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install -g typescript ts-node

      - name: Run validation script
        id: validation
        continue-on-error: true
        run: |
          echo "Running Microsoft updates validation..."
          ts-node scripts/validate-microsoft-updates.ts

          # Check if validation detected changes (exit code 1 = changes detected)
          if [ $? -eq 1 ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "✅ Validation complete - changes detected"
          elif [ $? -eq 0 ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "✅ Validation complete - no changes detected"
          else
            echo "has-changes=error" >> $GITHUB_OUTPUT
            echo "❌ Validation failed with error"
            exit 1
          fi

          echo "report-path=validation-report.md" >> $GITHUB_OUTPUT

      - name: Cleanup old validation artifacts
        if: steps.validation.outputs.has-changes == 'true' || github.event.inputs.force_notification == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'validation-report';
            const keepCount = 5;
            const perPage = 100;

            const all = [];
            for (let page = 1; page <= 10; page++) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page,
              });
              all.push(...res.data.artifacts);
              if (res.data.artifacts.length < perPage) break;
            }

            const matching = all
              .filter(a => a.name === artifactName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = matching.slice(keepCount);
            core.info(`Found ${matching.length} '${artifactName}' artifacts. Keeping ${keepCount}, deleting ${toDelete.length}.`);

            for (const a of toDelete) {
              core.info(`Deleting artifact id=${a.id} created_at=${a.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }

      - name: Upload validation report
        if: steps.validation.outputs.has-changes == 'true' || github.event.inputs.force_notification == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation-report.md
            validation-results.json
          retention-days: 14

      - name: Read validation results
        if: steps.validation.outputs.has-changes == 'true' || github.event.inputs.force_notification == 'true'
        id: read-results
        run: |
          # Read the JSON results
          RESULTS=$(cat validation-results.json)
          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Read the markdown report
          REPORT=$(cat validation-report.md)
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue for Review
        if: steps.validation.outputs.has-changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');
            const results = JSON.parse(fs.readFileSync('validation-results.json', 'utf8'));

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 Microsoft Product Updates Detected - ${new Date().toISOString().split('T')[0]}`,
              body: `${report}\n\n---\n\n## Sources Checked\n\nThis validation automatically checks the following official Microsoft sources:\n\n- ✅ [Microsoft 365 Copilot Release Notes](https://learn.microsoft.com/en-us/copilot/microsoft-365/release-notes)\n- ✅ [Copilot Studio What's New](https://learn.microsoft.com/en-us/microsoft-copilot-studio/whats-new)\n- ✅ [Azure AI Foundry Documentation](https://learn.microsoft.com/en-us/azure/ai-studio/what-is-ai-studio)\n- ✅ Microsoft 365 Roadmap (Copilot filter)\n- ✅ Power Platform Release Planner\n- ✅ Power Platform Pricing pages\n- ✅ Microsoft Learn documentation\n\n## Action Required\n\nPlease review the changes detected above and:\n\n1. **Verify**: Manually check the official Microsoft sources to confirm changes\n2. **Update Repository**: \n   - Survey questions in \`decision-model.v1.json\` if capabilities changed\n   - Licensing data in \`licensing-data.json\` if pricing/features changed\n   - Documentation files listed in the report\n3. **Test**: Run the wizard and verify recommendations are still accurate\n4. **Close**: Close this issue when all updates are complete\n\n**Auto-generated by weekly validation workflow** | [View Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['documentation', 'needs-review', 'automated', 'weekly-validation']
            });

            console.log(`Created issue #${issue.data.number}`);

  send-notification:
    name: Send Email Notification
    needs: validate-updates
    if: needs.validate-updates.outputs.has-changes == 'true' || github.event.inputs.force_notification == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validation artifacts
        uses: actions/download-artifact@v4
        with:
          name: validation-report

      - name: Trigger Power Automate Flow
        id: trigger-flow
        run: |
          # Read the validation report and results
          REPORT=$(cat validation-report.md)
          RESULTS=$(cat validation-results.json)

          # Prepare payload for Power Automate
          PAYLOAD=$(jq -n \
            --arg report "$REPORT" \
            --argjson results "$RESULTS" \
            --arg repoUrl "${{ github.server_url }}/${{ github.repository }}" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              report: $report,
              results: $results,
              repository: $repoUrl,
              workflowRun: $runUrl,
              timestamp: (now | todate)
            }')

          # Send to Power Automate HTTP trigger
          # Note: Store the Flow URL in GitHub Secrets as POWER_AUTOMATE_WEBHOOK_URL
          if [ -n "${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}" ]; then
            curl -X POST \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}"
            echo "✅ Notification sent to Power Automate"
          else
            echo "⚠️ POWER_AUTOMATE_WEBHOOK_URL not configured - skipping notification"
            echo "To enable email notifications:"
            echo "1. Create a Power Automate flow with HTTP trigger"
            echo "2. Add the webhook URL to GitHub Secrets as POWER_AUTOMATE_WEBHOOK_URL"
          fi

      - name: Alternative - Trigger Azure Logic App
        if: secrets.LOGIC_APP_WEBHOOK_URL != ''
        run: |
          # Alternative: Use Azure Logic App instead of Power Automate
          REPORT=$(cat validation-report.md)
          RESULTS=$(cat validation-results.json)

          PAYLOAD=$(jq -n \
            --arg report "$REPORT" \
            --argjson results "$RESULTS" \
            --arg repoUrl "${{ github.server_url }}/${{ github.repository }}" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              emailSubject: "Microsoft Product Updates Validation Report",
              emailBody: $report,
              validationResults: $results,
              repositoryUrl: $repoUrl,
              workflowRunUrl: $runUrl,
              requiresApproval: true
            }')

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.LOGIC_APP_WEBHOOK_URL }}"

          echo "✅ Notification sent to Azure Logic App"

  create-update-pr:
    name: Create Draft PR with Suggested Updates
    needs: validate-updates
    if: needs.validate-updates.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validation artifacts
        uses: actions/download-artifact@v4
        with:
          name: validation-report

      - name: Create update branch
        run: |
          BRANCH_NAME="automated/microsoft-updates-$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME"

          # Add the validation report to the branch
          git add validation-report.md validation-results.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: Microsoft product updates validation report $(date +%Y-%m-%d)"
          git push origin "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Draft Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 Microsoft Product Updates - ${new Date().toISOString().split('T')[0]}`,
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: `## Automated Update Detection\n\n${report}\n\n---\n\n### Review Checklist\n\n- [ ] Verified changes against official Microsoft sources\n- [ ] Updated \`licensing-data.json\` if needed\n- [ ] Updated \`.github/copilot-instructions.md\` if needed\n- [ ] Updated other documentation files as needed\n- [ ] Tested decision engine with updated data\n- [ ] All tests pass\n\n**This is an automated pull request. Please review carefully before merging.**`,
              draft: true
            });

            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['documentation', 'automated', 'needs-review']
            });

            console.log(`Created draft PR #${pr.data.number}`);
